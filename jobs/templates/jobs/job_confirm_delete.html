{% extends 'base.html' %}
{% block content %}
<div class="page">
  <div class="mx-auto max-w-lg px-4 sm:px-6">
    <div class="page-header">
      <h1 class="page-title">Delete job</h1>
      <p class="page-desc">This cannot be undone.</p>
    </div>
    <div class="card">
      <p class="text-muted-foreground">Delete <strong class="text-navy">{{ template_data.job.title }}</strong> at {{ template_data.job.company }}? All applications for this job will also be removed.</p>
      <form method="POST" class="mt-6 flex flex-wrap gap-2">
        {% csrf_token %}
        <button type="submit" class="inline-flex items-center rounded-md bg-danger px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-800">Delete permanently</button>
        <a class="btn-ghost" href="{% url 'jobs.recruiter_jobs' %}">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
