<!DOCTYPE html>
<html>
  {% load static %}
  <head>
    <title>{{ template_data.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --ink: #1A1D2E;
        --ink-muted: #6B7080;
        --border: #E3E5EC;
        --hover: #F5A623;
        --accent: #F5A623;
    }

      body {
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      .topbar {
        background: #FFFFFF;
        border-bottom: 1px solid var(--border);
        padding: 0.9rem 0;
      }

      .brand {
        font-weight: 600;
        font-size: 1.05rem;
        color: var(--ink);
        text-decoration: none;
        letter-spacing: -0.01em;
      }

      .brand:hover {
        color: var(--ink);
      }

      .topbar .nav-link {
        color: var(--ink-muted);
        font-weight: 500;
        font-size: 0.92rem;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .topbar .nav-link:hover {
        background: var(--hover);
        color: var(--ink);
      }

      .btn-signup {
        background: var(--ink);
        color: #FFFFFF;
        font-weight: 500;
        font-size: 0.92rem;
        padding: 0.4rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }

      .btn-signup:hover {
        opacity: 0.85;
        color: #FFFFFF;
      }

      .navbar-toggler {
        border: 1px solid var(--border);
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <nav class="topbar navbar navbar-expand-lg">
      <div class="container">
        <a class="brand" href="{% url 'home.index' %}">
          CS2340-Project2
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <a class="nav-link" href="{% url 'home.about' %}">About</a>
            <a class="nav-link" href="{% url 'accounts.login' %}">Log in</a>
            <a class="btn-signup ms-lg-2 mt-2 mt-lg-0" href="{% url 'accounts.signup' %}">Sign up</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Header -->

    <div>
      {% block content %}
      {% endblock content %}
    </div>
